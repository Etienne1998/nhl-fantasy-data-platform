name: Weekly NHL Fantasy Report

on:
  workflow_dispatch:

  schedule:
    # 7:30 AM Montreal during standard time (UTC-5)
    - cron: "30 12 * * 1"

    # 7:30 AM Montreal during daylight saving time (UTC-4)
    - cron: "30 11 * * 1"

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

            - name: Check Montreal local time
        id: schedule
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=America/Montreal date +%H)
          MINUTE=$(TZ=America/Montreal date +%M)

          if [ "$HOUR" = "07" ] && [ "$MINUTE" -ge 30 ] && [ "$MINUTE" -le 44 ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "Confirmed: within the 7:30-7:44 AM Montreal window."
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: outside the scheduled window."
          fi

      - name: Fetch ESPN available players
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.send == 'true'
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python src/ingestion/fetch_espn_available_players.py

      - name: Match ESPN players with NHL data
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.send == 'true'
        run: python src/fantasy/match_espn_available_players.py

      - name: Rank available players
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.send == 'true'
        run: python src/fantasy/rank_available_players.py

      - name: Generate and send weekly report
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.send == 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python src/fantasy/send_weekly_report.py --send