
name: Weekly NHL Fantasy Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Git commit:"
          git log -1 --oneline

          echo "Reference directory:"
          ls -la data/reference/

          echo "Gold directory:"
          ls -la data/gold/

          echo "Checking required files:"
          test -f data/reference/nhl_players_20262027.json && echo "NHL reference FOUND" || echo "NHL reference MISSING"
          test -f data/gold/player_performance_20262027.json && echo "Player performance FOUND" || echo "Player performance MISSING"  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ESPN available players
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python src/ingestion/fetch_espn_available_players.py

      - name: Match ESPN players with NHL data
        run: python src/fantasy/match_espn_available_players.py

      - name: Rank available players
        run: python src/fantasy/rank_available_players.py

      - name: Generate and send weekly report
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python src/fantasy/send_weekly_report.py --send
